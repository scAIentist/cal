# cal.scaientist.eu on Hetzner — Docker Compose
#
# Services:
#   db      Postgres 16 (data in the `db-data` volume)
#   calcom  the app image built by .github/workflows/scaientist-docker-image.yml
#   cron    tiny sidecar that calls the app's cron endpoints (reminders, calendar sync)
#
# Traefik: the `calcom` service joins an external `traefik` network and carries
# router labels for cal.scaientist.eu. Adjust the network name and the
# certresolver name to whatever the existing Traefik stack uses.
#
# Usage:  cp .env.example .env && edit .env && docker compose up -d

name: cal

networks:
  traefik:
    external: true
  internal:

volumes:
  db-data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  calcom:
    image: ghcr.io/scaientist/cal:${CAL_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db:5432
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.cal.rule: "Host(`cal.scaientist.eu`)"
      traefik.http.routers.cal.entrypoints: "websecure"
      traefik.http.routers.cal.tls.certresolver: "letsencrypt"
      traefik.http.services.cal.loadbalancer.server.port: "3000"

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    environment:
      CAL_INTERNAL_URL: http://calcom:3000
    volumes:
      - ./cron.sh:/cron.sh:ro
    entrypoint: ["/bin/sh", "/cron.sh"]
    depends_on:
      - calcom
    networks:
      - internal
