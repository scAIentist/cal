name: Deploy cal stack (Hetzner)

on:
  push:
    branches: [ main ]
    paths:
      - "deploy/cal/**"
      - ".github/workflows/deploy-hetzner.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that the CAL_ENV secret exists
        id: check
        run: |
          if [ -z "${{ secrets.CAL_ENV }}" ]; then
            echo "::warning::Repository secret CAL_ENV is not set — skipping deploy. Paste the contents of deploy/cal/.env.example with real values into the secret, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env from the CAL_ENV secret
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s\n' "${{ secrets.CAL_ENV }}" > deploy/cal/.env
          chmod 600 deploy/cal/.env

      - name: Copy stack files to VM
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/cal/*"
          strip_components: 1
          target: "/opt/stacks/"

      - name: Deploy cal stack (Hetzner)
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/stacks/cal
            chmod 600 .env
            chmod +x *.sh
            set -a; . ./.env; set +a
            docker stack deploy --with-registry-auth -c cal-stack.yml cal
            docker service ls --filter name=cal_
